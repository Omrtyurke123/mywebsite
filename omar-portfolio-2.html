/* ================= router ================= */
function route(){
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);
  let html;
  if(parts.length === 0) html = renderHome();
  else if(parts[0] === 'about') html = renderAbout();
  else if(parts[0] === 'posts' && parts.length === 1) html = renderPosts();
  else if(parts[0] === 'posts' && parts.length === 2) html = renderPost(parts[1]);
  else if(parts[0] === 'projects' && parts.length === 1) html = renderProjects();
  else if(parts[0] === 'projects' && parts.length === 2) html = renderProjectDetail(parts[1]);
  else if(parts[0] === 'uses') html = renderUses();
  else html = renderHome();

  $app.innerHTML = html;
  window.scrollTo(0,0);
  closeOverlay();
}

/* ================= mobile overlay ================= */
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuBtn');
const closeBtn = document.getElementById('closeBtn');
function openOverlay(){
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
  menuBtn.setAttribute('aria-expanded','true');
  document.body.style.overflow = 'hidden';
}
function closeOverlay(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  menuBtn.setAttribute('aria-expanded','false');
  document.body.style.overflow = '';
}
menuBtn.addEventListener('click', openOverlay);
closeBtn.addEventListener('click', closeOverlay);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeOverlay(); });
overlay.querySelectorAll('.ov-link').forEach(a => a.addEventListener('click', closeOverlay));

/* ================= theme toggle (in-memory only) ================= */
const root = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
let isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){
  root.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? '☀' : '☾';
}
themeBtn.addEventListener('click', () => { isDark = !isDark; applyTheme(); });
applyTheme();

window.addEventListener('hashchange', route);
route();
</script>
